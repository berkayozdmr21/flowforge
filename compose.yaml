name: flowforge
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: flowforge
      POSTGRES_PASSWORD: flowforge-local
      POSTGRES_DB: flowforge
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U flowforge -d flowforge']
      interval: 3s
      timeout: 3s
      retries: 30
  temporal:
    image: temporalio/temporal:1.9.1
    command: [server, start-dev, --ip, 0.0.0.0, --port, '7233', --ui-port, '8233', --db-filename, /data/temporal.db, --log-level, warn]
    volumes: [temporal-data:/data]
    ports: ['127.0.0.1:8239:8233']
    healthcheck:
      test: [CMD, temporal, operator, cluster, health, --address, '127.0.0.1:7233']
      interval: 3s
      timeout: 5s
      retries: 30
  api:
    build: .
    environment: &app-env
      DATABASE_URL: postgresql+psycopg://flowforge:flowforge-local@db:5432/flowforge
      TEMPORAL_ADDRESS: temporal:7233
      FLOWFORGE_DATA: /app/.runtime/data
    ports: ['127.0.0.1:${FLOWFORGE_PORT:-9030}:9030']
    volumes: [artifacts:/app/.runtime/data]
    depends_on:
      db: {condition: service_healthy}
      temporal: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9030/api/health/live', timeout=3)"]
      interval: 3s
      timeout: 4s
      retries: 30
  worker:
    build: .
    command: [python, -m, backend.app.worker]
    environment: *app-env
    volumes: [artifacts:/app/.runtime/data]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
volumes:
  postgres-data:
  temporal-data:
  artifacts:
